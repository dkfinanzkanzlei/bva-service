<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bildmarke ohne Text — Vorschau</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f7;color:#1d1d1f;padding:32px}
  h1{font-size:22px;margin:0 0 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;max-width:960px}
  .tile{border-radius:18px;display:grid;place-items:center;height:240px;border:1px solid #e5e5e7}
  .light{background:#fff}
  .green50{background:#f0f9f4}
  .dark{background:#0d0d0f}
  .gold{background:#c0954a}
  .tile img{width:140px;height:auto;display:block}
  .cap{font-size:13px;color:#777;margin:8px 2px 0}
  .small{display:flex;gap:14px;align-items:center;margin-top:28px}
  .small .chip{background:#fff;border:1px solid #e5e5e7;border-radius:10px;padding:8px;display:grid;place-items:center}
</style></head>
<body>
  <h1>Bildmarke ohne Text — zwei Ringe (Grün&nbsp;#173d31 / Gold&nbsp;#c0954a)</h1>
  <div class="grid">
    <div><div class="tile light"><img src="assets/icon_rings.png"></div><div class="cap">auf Weiß</div></div>
    <div><div class="tile green50"><img src="assets/icon_rings.png"></div><div class="cap">auf hellem Grün (#f0f9f4)</div></div>
    <div><div class="tile dark"><img src="assets/icon_rings.png"></div><div class="cap">auf dunklem Grund (#0d0d0f)</div></div>
    <div><div class="tile gold"><img src="assets/icon_rings.png"></div><div class="cap">auf Gold (#c0954a)</div></div>
  </div>
  <div class="small">
    <span>So klein wie im Favicon:</span>
    <div class="chip"><img src="assets/favicon_bva.png?v=7" width="16" height="16"></div>
    <div class="chip"><img src="assets/favicon_bva.png?v=7" width="32" height="32"></div>
    <div class="chip"><img src="assets/favicon_bva.png?v=7" width="64" height="64"></div>
  </div>
</body></html>
